name: Build Mac DMG

on:
  # 手动触发：在 GitHub Actions 页面点击 "Run workflow"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，默认使用 package.json）'
        required: false
        type: string
  # 或创建 tag 时自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 允许创建 Release

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Mac DMG
        run: npm run tauri:build -- --bundles dmg

      # 手动触发：上传 artifact 供下载
      - name: Upload DMG artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FlowFit-Mac-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # Tag 推送：自动发布 GitHub Release
      - name: Create Release & Upload DMG
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          name: "FlowFit ${{ github.ref_name }}"
          body: |
            ## FlowFit ${{ github.ref_name }} macOS 安装包

            ### 安装方法
            1. 下载 `FlowFit_*.dmg`
            2. 双击挂载
            3. 将 FlowFit 拖入 Applications 文件夹

            ### 系统要求
            - macOS 10.15 (Catalina) 及以上
            - Intel 或 Apple Silicon（M1/M2/M3）

            > 更多信息请查看 [项目主页](https://github.com/${{ github.repository }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
