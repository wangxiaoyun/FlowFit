name: Build & Release

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选）'
        required: false
        type: string
  # Tag 推送自动触发
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ────────────── macOS 构建 ──────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Upload Mac DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ────────────── Windows 构建 ──────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows NSIS
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Win NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ─────── Tag 推送时：收集双平台产物 + 发布 Release ───────
  create-release:
    needs: [build-mac, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: artifacts/mac

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: win-nsis
          path: artifacts/win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
          name: "FlowFit ${{ github.ref_name }}"
          body: |
            ## FlowFit ${{ github.ref_name }}

            ### 📥 下载
            | 平台 | 安装包 |
            |------|--------|
            | 🍎 macOS | `FlowFit_*.dmg` |
            | 🪟 Windows | `FlowFit_*.exe` |

            ### macOS 安装
            1. 双击 `.dmg` 挂载
            2. 将 FlowFit 拖入 **Applications** 文件夹

            ### Windows 安装
            1. 双击 `.exe` 运行安装程序
            2. 按向导完成安装

            ### 系统要求
            - **macOS** 10.15+ (Intel / Apple Silicon)
            - **Windows** 10/11 (x64)

            > 更多信息请查看 [项目主页](https://github.com/${{ github.repository }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
